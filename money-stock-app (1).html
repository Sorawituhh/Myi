<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เงินของฉัน</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;700&display=swap">
<style>
:root{color-scheme:dark;--bg:#05080F;--card:#0D1422;--ink:#E8F0FF;--mute:#8A9BB8;--line:#1B2740;--brand:#1F7AEE;--brandText:#fff;--up:#4CC785;--down:#F07070;--chip:#16213A;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Thai',system-ui,sans-serif;font-size:16px;line-height:1.5;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 14px;font-weight:700}
h2{font-size:16px;margin:20px 0 8px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.hero{background:var(--brand);color:var(--brandText);border:0}
.hero small{opacity:.8}
.big{font-size:32px;font-weight:700;line-height:1.2}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mute{color:var(--mute);font-size:14px}
.up{color:var(--up)}.down{color:var(--down)}
.hero .up,.hero .down{color:inherit}
input,select,button{font:inherit;color:inherit}
input,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin-bottom:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
textarea{font:inherit;color:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin-bottom:8px;resize:vertical}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.btn{width:100%;padding:12px;border:0;border-radius:10px;background:var(--brand);color:var(--brandText);font-weight:700;cursor:pointer}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px;margin-bottom:8px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--card);font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.chip{border:1px solid var(--line);background:var(--card);padding:6px 14px;border-radius:99px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--brand);color:var(--brandText);border-color:var(--brand)}
.x{border:0;background:none;color:var(--mute);font-size:20px;cursor:pointer;padding:0 4px}
.bar{height:8px;border-radius:4px;background:var(--chip);margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand)}
.price{width:96px;margin:0;text-align:right;padding:6px 8px}
.tag{display:inline-block;background:var(--chip);border-radius:6px;padding:0 8px;font-size:13px;font-weight:700;margin-right:6px}
.news{cursor:pointer}
body.start,body.menu,body.login{padding-bottom:env(safe-area-inset-bottom,0px)}
body.start nav,body.menu nav,body.login nav{display:none}
.hs{display:flex;align-items:center;justify-content:center;min-height:80vh}
.sq{width:min(100%,330px);aspect-ratio:1/1;border-radius:28px;border:1px solid #1F7AEE;background:linear-gradient(160deg,#0C2347 0%,#070D1A 60%,#05080F 100%);box-shadow:0 0 48px rgba(31,122,238,.28);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;position:relative;overflow:hidden}
.sq svg{position:absolute;left:0;top:0;width:100%;height:46%}
.sq h1{font-size:30px;margin:0 0 6px;position:relative}
.sq p{margin:0 0 22px;color:var(--mute);position:relative}
.go{position:relative;border:0;border-radius:99px;background:var(--brand);color:#fff;font-weight:700;font-size:20px;padding:12px 56px;cursor:pointer;animation:glow 2.4s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(31,122,238,.5)}50%{box-shadow:0 0 0 10px rgba(31,122,238,0)}}
@media (prefers-reduced-motion:reduce){.go{animation:none}}
.back{border:0;background:none;color:var(--brand);font-size:15px;padding:4px 0;margin-bottom:4px;cursor:pointer}
.mi{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer}
.mi .ic{width:46px;height:46px;border-radius:12px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.mi b{display:block;font-size:17px}.mi span.mute{display:block}
.mi .ch{margin-left:auto;color:var(--mute);font-size:22px}
.av{display:block;width:84px;height:84px;border-radius:50%;padding:3px;background:linear-gradient(135deg,#1F7AEE,#5AA9FF,#9AD0FF);flex:none}
.av span{width:100%;height:100%;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700}
.stats{display:flex;flex:1;justify-content:space-around;text-align:center}.stats b{display:block;font-size:18px}.stats span{font-size:13px;color:var(--mute)}
.story{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;cursor:pointer;min-width:68px;color:var(--ink)}
.story .av{width:60px;height:60px}.story .av span{font-size:22px}.story small{font-size:12px;max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rb{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));background:var(--brand);color:#fff;padding:14px;border-radius:14px;z-index:9;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700}
.tm{font-size:44px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;margin:8px 0}
.disp{text-align:right;padding:18px 14px}.disp .big{overflow-x:auto;white-space:nowrap}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.keys button{border:0;border-radius:14px;padding:18px 0;font-size:22px;background:var(--chip);color:var(--ink);cursor:pointer}.keys .op{background:var(--brand);color:var(--brandText)}.keys .fn{color:#5AA9FF}.keys .w2{grid-column:span 2}
.news p{margin:8px 0 0;font-size:15px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;padding:12px 2px;font-size:13px;color:var(--mute);cursor:pointer}
nav button.on{color:var(--brand);font-weight:700}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
:root{--bg:#06070D;--card:#0E1120;--ink:#EEF3FF;--mute:#93A0C4;--line:rgba(190,205,255,.22);--brand:#5B7BF0;--chip:#1A2040;--irid:linear-gradient(120deg,#ff6ad5,#c774e8 25%,#8795e8 50%,#5ad7ff 75%,#9dffd0);--chrome:linear-gradient(180deg,#ffffff,#9fb4d6 55%,#e6efff)}
body{background:radial-gradient(circle at 12% 0%,rgba(255,106,213,.2),transparent 38%),radial-gradient(circle at 95% 8%,rgba(90,215,255,.2),transparent 40%),radial-gradient(circle at 50% 100%,rgba(135,149,232,.16),transparent 45%),#05060C;background-attachment:fixed}
h1{background:var(--chrome);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.01em}
.card{background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.015) 45%),var(--card);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 6px 22px rgba(0,0,0,.4)}
.hero{background:linear-gradient(135deg,#3a1a6e,#1b3a9a 45%,#0d6b8a);border:1px solid rgba(255,255,255,.35);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 0 28px rgba(135,149,232,.35)}
.btn{background:var(--irid);color:#0A0A18;border-radius:999px;box-shadow:inset 0 2px 0 rgba(255,255,255,.75),inset 0 -3px 6px rgba(20,10,80,.35),0 0 18px rgba(135,149,232,.45)}
.chip.on,.seg button.on{background:var(--irid);color:#0A0A18;border-color:transparent;font-weight:700}
.chip{border-color:var(--line)}
.seg{background:rgba(255,255,255,.06);border:1px solid var(--line)}
input,select,textarea{border-color:var(--line);background:rgba(255,255,255,.05)}
nav{background:linear-gradient(180deg,rgba(40,48,90,.85),rgba(10,12,28,.95));border-top:1px solid rgba(220,230,255,.4);box-shadow:0 -6px 24px rgba(0,0,0,.5)}
nav button.on{background:var(--irid);-webkit-background-clip:text;background-clip:text;color:transparent}
.sq{border:2px solid transparent;background:linear-gradient(160deg,#0C1230,#05060C) padding-box,linear-gradient(135deg,#fff,#8fa8ff,#ff6ad5,#5ad7ff,#fff) border-box;box-shadow:0 0 50px rgba(135,149,232,.4)}
.sq h1{font-size:34px}
.go{background:var(--irid);color:#0A0A18;box-shadow:inset 0 2px 0 rgba(255,255,255,.8),inset 0 -4px 8px rgba(20,10,80,.35),0 0 24px rgba(199,116,232,.6)}
.mi{background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.015) 45%),var(--card);box-shadow:inset 0 1px 0 rgba(255,255,255,.28)}
.mi .ic{background:radial-gradient(circle at 30% 25%,#2e3a70,#080b1a);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 0 14px rgba(135,149,232,.3)}
.av{background:var(--irid)}
.keys button{background:linear-gradient(180deg,#3b4570,#151a30);border:1px solid rgba(200,215,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 3px 8px rgba(0,0,0,.4)}
.keys .op{background:var(--irid);color:#0A0A18}
.keys .fn{color:#9dd0ff}
.rb{background:var(--irid);color:#0A0A18}
.bar i{background:var(--irid)}
.tm{background:var(--chrome);-webkit-background-clip:text;background-clip:text;color:transparent}
.ub{display:inline-block;max-width:85%;padding:10px 14px;border-radius:18px 18px 4px 18px;background:var(--chip);border:1px solid var(--line);text-align:left;white-space:pre-wrap;word-break:break-word;margin:6px 0}
.ab{white-space:pre-wrap;word-break:break-word;margin:2px 0 10px;line-height:1.7}
a.lk{color:#9dc0ff;text-decoration:underline;word-break:break-all}
#cm a.lk{color:inherit}
.hi{flex:1;text-align:left;background:none;border:0;color:inherit;cursor:pointer;min-width:0;padding:0}.hi b{display:block}
html{scroll-behavior:smooth}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(12px)}to{opacity:1;transform:none}}
#v.enter>*{animation:rise .5s cubic-bezier(.22,1,.36,1) both}
#v.enter>:nth-child(2){animation-delay:0.04s}
#v.enter>:nth-child(3){animation-delay:0.09s}
#v.enter>:nth-child(4){animation-delay:0.14s}
#v.enter>:nth-child(5){animation-delay:0.18s}
#v.enter>:nth-child(6){animation-delay:0.22s}
#v.enter>:nth-child(7){animation-delay:0.27s}
#v.enter>:nth-child(8){animation-delay:0.32s}
#v.enter>:nth-child(9){animation-delay:0.36s}
#v.enter>:nth-child(10){animation-delay:0.40s}
#v.enter>:nth-child(11){animation-delay:0.45s}
#v.enter>:nth-child(12){animation-delay:0.49s}
#v.enter .sq{animation:pop .8s cubic-bezier(.22,1,.36,1) both}
button,.card,.mi,.chip{transition:transform .16s ease,box-shadow .2s ease,filter .2s ease}
button:active{transform:scale(.96)}
.mi:active{transform:scale(.985)}
@media (hover:hover){.btn:hover,.go:hover{filter:brightness(1.1)}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}#v.enter>*,#v.enter .sq{animation:none}button,.card,.mi,.chip{transition:none}}
</style>
</head>
<body><svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="gc1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#a9bde3"/></linearGradient><linearGradient id="gc2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fa4cf"/><stop offset="1" stop-color="#3b4a74"/></linearGradient><linearGradient id="gc3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a3556"/><stop offset="1" stop-color="#0e1328"/></linearGradient><radialGradient id="gsp" cx=".3" cy=".25" r=".85"><stop offset="0" stop-color="#fff"/><stop offset=".4" stop-color="#9fb4d6"/><stop offset=".75" stop-color="#2a3550"/><stop offset="1" stop-color="#111830"/></radialGradient><linearGradient id="gir" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6ad5"/><stop offset=".3" stop-color="#c774e8"/><stop offset=".55" stop-color="#8795e8"/><stop offset=".8" stop-color="#5ad7ff"/><stop offset="1" stop-color="#9dffd0"/></linearGradient></defs></svg>
<main id="v"></main>
<nav>
<button data-t="cash" class="on">รับ-จ่าย</button>
<button data-t="port">พอร์ตหุ้น</button>
<button data-t="news">ข่าวหุ้น</button>
<button data-t="calc">คิดเลข</button>
<button data-t="notes">โน้ต</button>
</nav>
<script>
var KEY='money-stock-v1',tab='cash',kind='out',newsSym='ทั้งหมด',openNews=-1;
var CATS={out:['อาหาร','เดินทาง','ที่พัก','ช้อปปิ้ง','อื่นๆ'],inc:['เงินเดือน','ปันผล','รายได้เสริม','อื่นๆ']};
var S={tx:[],hold:[
{s:'PTT',n:100,c:34,p:35.5},{s:'CPALL',n:50,c:58,p:55},{s:'AOT',n:30,c:62,p:60.25}]};
try{var r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
if(!S.notes)S.notes=[];if(!S.places)S.places=[];if(!S.alarms)S.alarms=[];if(!S.fx)S.fx={};if(!S.convs)S.convs=[];
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(t){return String(t).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function f(n,d){return Number(n).toLocaleString('th-TH',{minimumFractionDigits:d||0,maximumFractionDigits:d===undefined?0:d})}
function sg(n,d){return(n>0?'+':'')+f(n,d)}
function cls(n){return n>0?'up':n<0?'down':''}
var NEWS=[
{s:'PTT',t:'ราคาน้ำมันดิบผันผวน นักวิเคราะห์จับตากำไรกลุ่มพลังงาน',d:'วันนี้',b:'ข่าวตัวอย่าง: นักวิเคราะห์ประเมินว่ากำไรกลุ่มพลังงานจะขึ้นกับทิศทางราคาน้ำมันในไตรมาสหน้า'},
{s:'CPALL',t:'ยอดขายสาขาเดิมกลุ่มค้าปลีกยังเติบโตต่อเนื่อง',d:'วันนี้',b:'ข่าวตัวอย่าง: ผู้บริหารมองการบริโภคในประเทศทรงตัว ขณะที่ต้นทุนสินค้าเริ่มคลี่คลาย'},
{s:'AOT',t:'นักท่องเที่ยวต่างชาติเพิ่มขึ้น หนุนผู้โดยสารสนามบิน',d:'เมื่อวาน',b:'ข่าวตัวอย่าง: จำนวนผู้โดยสารรวมมีแนวโน้มสูงขึ้นในช่วงไฮซีซัน'},
{s:'ตลาดรวม',t:'ดัชนี SET ปิดทรงตัว รอปัจจัยต่างประเทศ',d:'เมื่อวาน',b:'ข่าวตัวอย่าง: นักลงทุนรอดูตัวเลขเศรษฐกิจสำคัญก่อนตัดสินใจลงทุนเพิ่ม'},
{s:'PTT',t:'บริษัทประกาศแผนลงทุนพลังงานสะอาดเพิ่ม',d:'2 วันก่อน',b:'ข่าวตัวอย่าง: แผนลงทุนระยะยาวเน้นโครงการพลังงานทดแทนและแบตเตอรี่'}];

function cash(){
var now=new Date(),ym=now.getFullYear()*100+now.getMonth(),m=S.tx.filter(function(t){var d=new Date(t.d);return d.getFullYear()*100+d.getMonth()===ym});
var inc=0,out=0,bc={};m.forEach(function(t){if(t.k==='inc')inc+=t.a;else{out+=t.a;bc[t.c]=(bc[t.c]||0)+t.a}});
var h='<h1>รายรับรายจ่าย</h1><div class="card hero"><small>คงเหลือเดือนนี้</small><div class="big">฿'+f(inc-out)+'</div><div class="row" style="margin-top:8px"><span>รับ ฿'+f(inc)+'</span><span>จ่าย ฿'+f(out)+'</span></div></div>';
h+='<div class="card"><div class="seg"><button data-k="out" class="'+(kind==='out'?'on':'')+'">รายจ่าย</button><button data-k="inc" class="'+(kind==='inc'?'on':'')+'">รายรับ</button></div>';
h+='<input id="a" type="number" inputmode="decimal" placeholder="จำนวนเงิน (บาท)"><select id="c">'+CATS[kind].map(function(c){return'<option>'+c+'</option>'}).join('')+'</select><input id="nt" placeholder="บันทึกเพิ่มเติม (ไม่บังคับ)"><button class="btn" id="addTx">บันทึกรายการ</button></div>';
var ks=Object.keys(bc).sort(function(a,b){return bc[b]-bc[a]});
if(ks.length){h+='<h2>รายจ่ายแยกหมวด</h2><div class="card">'+ks.map(function(k){return'<div style="margin-bottom:10px"><div class="row"><span>'+esc(k)+'</span><span>฿'+f(bc[k])+'</span></div><div class="bar"><i style="width:'+Math.round(bc[k]/out*100)+'%"></i></div></div>'}).join('')+'</div>'}
h+='<h2>รายการล่าสุด</h2>';
if(!S.tx.length)h+='<div class="card mute">ยังไม่มีรายการ ลองบันทึกรายจ่ายแรกของคุณด้านบน</div>';
S.tx.slice().reverse().slice(0,30).forEach(function(t){var i=S.tx.indexOf(t);h+='<div class="card row"><div><div>'+esc(t.c)+(t.n?' <span class="mute">· '+esc(t.n)+'</span>':'')+'</div><div class="mute">'+new Date(t.d).toLocaleDateString('th-TH',{day:'numeric',month:'short'})+'</div></div><div class="row"><b class="'+(t.k==='inc'?'up':'down')+'">'+(t.k==='inc'?'+':'-')+f(t.a)+'</b></div></div>'});
return h}

function port(){
var tv=0,tc=0;S.hold.forEach(function(x){tv+=x.n*x.p;tc+=x.n*x.c});var pl=tv-tc,pc=tc?pl/tc*100:0;
var h='<h1>พอร์ตหุ้น</h1><div class="card hero"><small>มูลค่าพอร์ต</small><div class="big">฿'+f(tv,2)+'</div><div style="margin-top:8px">กำไร/ขาดทุน '+sg(pl,2)+' ('+sg(pc,2)+'%)</div></div>';
h+='<p class="mute">ราคาในต้นแบบเป็นตัวอย่าง แตะช่องราคาเพื่อแก้เป็นราคาปัจจุบันได้</p>';
if(!S.hold.length)h+='<div class="card mute">ยังไม่มีหุ้นในพอร์ต เพิ่มตัวแรกด้านล่าง</div>';

h+='<h2>เพิ่มหุ้น</h2><div class="card"><input id="hs" placeholder="ชื่อหุ้น เช่น PTT"><div class="grid3"><input id="hn" type="number" inputmode="decimal" placeholder="จำนวน"><input id="hc" type="number" inputmode="decimal" step="any" placeholder="ต้นทุน"><input id="hp" type="number" inputmode="decimal" step="any" placeholder="ราคาตอนนี้"></div><button class="btn" id="addH">เพิ่มเข้าพอร์ต</button></div>';

function key(k){

if(/^\d$/.test(k)){if(C.f||C.d==='0'){C.d=k;C.f=false}else if(C.d.length<14)C.d+=k}
else if(k==='.'){if(C.f){C.d='0.';C.f=false}else if(C.d.indexOf('.')<0)C.d+='.'}

var SYS='คุณชื่อเอิร์ธ เป็นผู้ช่วยในแอพของผู้ใช้ ตอบคำถามได้หลากหลายทุกเรื่อง ไม่จำกัดเฉพาะการเงิน แทนตัวเองว่า เอิร์ธ ตอบเป็นภาษาไทยที่กระชับ ตรงประเด็น และถูกต้อง ถ้าไม่แน่ใจให้บอกตามตรงแทนการเดา ตอบเป็นข้อความธรรมดา ห้ามใช้ markdown หรือสัญลักษณ์ * # ถ้าถามเรื่องข้อมูลที่เปลี่ยนตลอดเวลา เช่น ราคาหุ้น ข่าวล่าสุด ให้บอกว่าเข้าถึงข้อมูลสดไม่ได้และแนะนำให้เช็กจากแหล่งทางการ เรื่องการลงทุนให้ข้อมูลเชิงความรู้ ไม่ใช่คำแนะนำให้ซื้อขาย ถ้าผู้ใช้ถามจริงจังว่าเป็นใครหรือเป็น AI หรือไม่ ให้ตอบตรงๆ ว่าเป็นผู้ช่วย AI ที่ใช้ Claude ของ Anthropic คุณเปิดอ่านลิงก์ไม่ได้ ถ้าผู้ใช้ส่งลิงก์ ให้บอกว่าอ่านเนื้อหาในลิงก์ไม่ได้และขอให้คัดลอกข้อความมาวางแทน ถ้าผู้ใช้แนบรูป ให้ดูรูปประกอบการตอบ\n\n';
function askH(){if(AV==='hist')return histH();setTimeout(function(){ra();rv()},0);return'<div class="row"><h1 style="margin:4px 0 14px">ถามข้อมูล</h1><span style="display:flex;gap:6px"><button class="chip" data-hv="1">ประวัติ</button><button class="chip on" data-hn="1">แชทใหม่</button></span></div><div id="ac"></div><div class="card" style="padding:8px"><div id="aqv"></div><input id="aqf" type="file" accept="image/*" multiple hidden><div id="an" class="mute" style="font-size:13px"></div><textarea id="aqi" rows="2" placeholder="ถามอะไรก็ได้..." style="margin:0;border:0;background:transparent"></textarea><div class="row"><span style="display:flex;gap:6px"><button class="chip" data-aqp="1">แนบรูป</button></span><button class="btn" id="aqs" style="width:auto;padding:8px 22px">ส่ง</button></div></div><p class="mute" style="font-size:12px;text-align:center">เอิร์ธตอบจากความรู้ที่มี ไม่ใช่ข้อมูลสด ตรวจสอบข้อมูลสำคัญก่อนใช้</p>'}
var AF=[],AFU=[];
function lk(s){return esc(s).replace(/(https?:\/\/[^\s<]+)/g,function(u){return'<a class="lk" href="'+u+'" target="_blank" rel="noopener noreferrer">'+u+'</a>'})}
function anote(m){var n=el('an');if(n)n.textContent=m}
function rv(){var v=el('aqv');if(v)v.innerHTML=AFU.map(function(u,i){return'<div style="position:relative;display:inline-block;margin:4px 6px 8px 4px"><img src="'+u+'" style="height:64px;border-radius:10px;display:block" alt="รูปที่แนบ"><button class="chip" data-aqrm="'+i+'" style="position:absolute;top:-8px;right:-8px;padding:0 8px" aria-label="เอารูปออก">×</button></div>'}).join('')}
function ra(){var c=el('ac');if(!c)return;c.innerHTML=AQ.length?AQ.map(function(m){return m.r==='u'?'<div style="text-align:right"><span class="ub">'+(m.imgs||[]).map(function(u){return'<img src="'+u+'" style="max-width:100%;border-radius:12px;display:block;margin-bottom:6px" alt="รูปที่แนบ">'}).join('')+((!(m.imgs&&m.imgs.length)&&m.n)?'<div class="mute" style="font-size:12px">แนบรูป '+m.n+' รูป (ไม่ได้บันทึกรูปในประวัติ)</div>':'')+lk(m.t)+'</span></div>':'<div class="mute" style="font-size:12px;margin-top:8px">เอิร์ธ</div><div class="ab">'+(lk(m.t)||'กำลังคิด...')+'</div>'}).join(''):'<div class="card"><b>ถามอะไรก็ได้</b><div class="mute" style="margin:4px 0 10px">เอิร์ธจะตอบในแอพนี้ ถามเรื่องอะไรก็ได้ วางลิงก์หรือแนบรูปก็ได้</div>'+SUG.map(function(s,i){return'<button class="chip" style="display:block;margin-bottom:8px;text-align:left" data-aqx="'+i+'">'+esc(s)+'</button>'}).join('')+'</div>';window.scrollTo(0,document.body.scrollHeight)}
async function askGo(q){if(AB)return;var i=el('aqi');q=(q||(i&&i.value)||'').trim();var img=AF.slice(),iu=AFU.slice();if(!q&&!img.length)return;if(!q)q=img.length>1?'ช่วยดูรูปเหล่านี้ให้หน่อย':'ช่วยดูรูปนี้ให้หน่อย';if(i)i.value='';AF=[];AFU=[];rv();anote('');
AQ.push({r:'u',t:q.slice(0,2000),imgs:iu,n:iu.length});AQ.push({r:'a',t:''});if(!CID)CID=Date.now();pc();AB=true;ra();var last=AQ[AQ.length-1];
try{var sm=await claude.use('sample');if(!sm)throw{code:'na'};var hist=AQ.slice(0,-1).slice(-12).map(function(m){return{role:m.r==='u'?'user':'assistant',content:m.t+(((m.imgs&&m.imgs.length)||m.n)?' [ผู้ใช้แนบรูปภาพ '+((m.imgs&&m.imgs.length)||m.n)+' รูปมาด้วย]':'')}});while(hist.length&&hist[0].role!=='user')hist.shift();hist[0].content=SYS+'คำถาม: '+hist[0].content;
var o={cache:false,onText:function(x){last.t=x.text;ra()}};if(img.length)o.images=img;
var r=await sm(hist,o);last.t=r.text}
catch(e){var c=e&&e.code;last.t=(e&&e.text)||(c==='not_granted'?'ยังไม่ได้อนุญาตให้เอิร์ธตอบในแอพนี้ กดส่งอีกครั้งแล้วกดอนุญาต':c==='rate_limited'?'ใช้งานถี่เกินไป ลองใหม่อีกครั้งในอีกสักครู่':(c==='images_unavailable'||c==='image_rejected')?'ส่งรูปนี้ไม่ได้ ลองรูปอื่นหรือส่งโดยไม่แนบรูป':'ตอบไม่ได้ในตอนนี้ ฟีเจอร์นี้ใช้ได้เมื่อเปิดแอพผ่าน claude.ai')}
AB=false;ra();pc()}
document.addEventListener('click',function(e){var t=e.target.closest('button');if(!t)return;if(t.id==='aqs')askGo();else if(t.dataset.aqx!==undefined)askGo(SUG[+t.dataset.aqx]);else if(t.dataset.aqc){AQ=[];AB=false;AF=[];AFU=[];rv();ra()}else if(t.dataset.aqp){var f=el('aqf');if(f)f.click()}else if(t.dataset.aqrm!==undefined){AF.splice(+t.dataset.aqrm,1);AFU.splice(+t.dataset.aqrm,1);rv();anote('')}});
document.addEventListener('change',function(e){if(e.target.id!=='aqf')return;var fs=Array.from(e.target.files);e.target.value='';if(!fs.length)return;(async function(){var lim=null;try{var sm=await claude.use('sample');lim=sm&&await sm.limits()}catch(x){}var im=lim&&lim.images;if(!im){anote('ตอนนี้แนบรูปไม่ได้ ต้องเปิดแอพผ่าน claude.ai และอนุญาตให้ส่งรูป');return}var room=im.maxCount-AF.length,msg='';if(room<=0){anote('แนบได้สูงสุด '+im.maxCount+' รูป');return}
var ok=[];fs.forEach(function(f){if(im.mediaTypes.indexOf(f.type)<0)msg='รองรับเฉพาะไฟล์ภาพ JPEG, PNG, WebP หรือ GIF';else if(f.size>im.maxInputBytes)msg='บางไฟล์ใหญ่เกินไป จึงข้ามไป';else if(ok.length<room)ok.push(f);else msg='แนบได้สูงสุด '+im.maxCount+' รูป'});
var urls=await Promise.all(ok.map(function(f){return new Promise(function(res){var rd=new FileReader();rd.onload=function(){res(String(rd.result))};rd.onerror=function(){res('')};rd.readAsDataURL(f)})}));
ok.forEach(function(f,i){if(urls[i]){AF.push(f);AFU.push(urls[i])}});rv();anote(msg)})()});
document.addEventListener('keydown',function(e){if(e.target.id==='aqi'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();askGo()}});
var AV='chat',CID=null,HQ='',HD=-1;
function pc(){if(!AQ.length||!CID)return;var cv=S.convs.filter(function(c){return c.id===CID})[0];if(!cv){cv={id:CID,title:AQ[0].t.slice(0,40),msgs:[]};S.convs.push(cv)}cv.t=Date.now();cv.msgs=AQ.map(function(m){return{r:m.r,t:m.t,n:(m.imgs&&m.imgs.length)||m.n||0}});if(S.convs.length>50){S.convs.sort(function(a,b){return b.t-a.t});S.convs=S.convs.slice(0,50)}save()}
function histH(){setTimeout(rl2,0);return'<div class="row"><button class="back" data-hb="1">‹ กลับไปแชท</button><button class="chip on" data-hn="1">แชทใหม่</button></div><h1>ประวัติแชท</h1><input id="hq" type="search" placeholder="ค้นหาในประวัติแชท" value="'+esc(HQ)+'"><div id="hl"></div>'}
function rl2(){var e=el('hl');if(!e)return;var q=HQ.trim().toLowerCase(),l=S.convs.slice().sort(function(a,b){return b.t-a.t}).filter(function(c){return!q||(c.title+' '+c.msgs.map(function(m){return m.t}).join(' ')).toLowerCase().indexOf(q)>=0});
e.innerHTML=l.length?l.map(function(c){var last=c.msgs.filter(function(m){return m.r==='a'&&m.t}).pop();return'<div class="card row"><button class="hi" data-ho="'+c.id+'"><b>'+esc(c.title)+'</b><span class="mute" style="font-size:13px;display:block">'+new Date(c.t).toLocaleDateString('th-TH',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+'</span>'+(last?'<span class="mute" style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(last.t.slice(0,80))+'</span>':'')+'</button><button class="x" data-hd="'+c.id+'" aria-label="ลบแชท">'+(HD===c.id?'<span class="down" style="font-size:14px">แตะอีกครั้งเพื่อลบ</span>':'×')+'</button></div>'}).join(''):'<div class="card mute">'+(S.convs.length?'ไม่พบแชทที่ตรงกับคำค้น':'ยังไม่มีประวัติแชท เริ่มถามเอิร์ธแล้วจะถูกบันทึกไว้ที่นี่')+'</div>'}
document.addEventListener('click',function(e){var t=e.target.closest('button');if(!t)return;var d=t.dataset;
if(d.hd!==undefined){var id=+d.hd;if(HD===id){S.convs=S.convs.filter(function(x){return x.id!==id});if(CID===id){CID=null;AQ=[]}HD=-1;save()}else HD=id;rl2();return}
if(AB&&(d.hv||d.hb||d.hn||d.ho))return;
if(d.hv){AV='hist';HD=-1;draw()}
else if(d.hb){AV='chat';draw()}
else if(d.hn){AV='chat';AQ=[];CID=null;AF=[];AFU=[];draw()}
else if(d.ho){var c=S.convs.filter(function(x){return String(x.id)===d.ho})[0];if(c){CID=c.id;AQ=c.msgs.map(function(m){return{r:m.r,t:m.t,imgs:[],n:m.n||0}});AF=[];AFU=[];AV='chat';draw()}}});
document.addEventListener('input',function(e){if(e.target.id==='hq'){HQ=e.target.value;rl2()}});
draw();
</script>
